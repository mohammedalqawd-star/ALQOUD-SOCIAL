name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Configure Firebase Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON repository secret. Add the complete google-services.json content in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Validate Firebase project and Android package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          project_id = config.get("project_info", {}).get("project_id", "")
          packages = [
              item.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
              for item in config.get("client", [])
          ]
          expected_project = "alqoud-social-6686c"
          expected_package = "com.alqoud.social"
          print(f"Firebase project: {project_id}")
          print(f"Android package(s): {', '.join(packages)}")
          if project_id != expected_project or expected_package not in packages:
              raise SystemExit(
                  "Wrong Firebase configuration. Use project alqoud-social-6686c "
                  "with Android package com.alqoud.social."
              )
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          echo "flutter.sdk=$(dirname "$(dirname "$(command -v flutter)")")" > local.properties
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alqoud-social-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
