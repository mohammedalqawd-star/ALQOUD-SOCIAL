name: Firebase Functions Check

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"

permissions:
  contents: read

jobs:
  check-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Install dependencies
        working-directory: functions
        run: npm install
      - name: TypeScript check
        working-directory: functions
        run: npm run build
